name: Daily Component Update

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report available updates without changing daily
        type: boolean
        default: false
      source_ref:
        description: Manifest ref for dry-run testing only
        type: string
        default: develop

permissions:
  actions: write
  contents: write

jobs:
  update:
    uses: sima-neat/model-compiler/.github/workflows/update-components-worker.yml@develop
    with:
      dry_run: ${{ inputs.dry_run || false }}
      source_ref: ${{ inputs.source_ref || 'develop' }}
    secrets: inherit
