name: Daily Build Slack Notification

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [daily]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: github.event.workflow_run.head_repository.full_name == github.repository
    uses: sima-neat/model-compiler/.github/workflows/daily-build-notify-worker.yml@develop
    secrets: inherit
